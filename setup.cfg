# Conferência de estilo usada no CI (testes.yml): espaços depois de vírgulas, em volta de operadores
# e linhas em branco entre funções. Linhas longas ainda não são cobradas.
[pycodestyle]
select = E225,E226,E228,E231,E251,E261,E262,E301,E302,E303,E305,W291,W293
exclude = .git,__pycache__,build,dist
