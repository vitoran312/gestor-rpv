name: Medir troca de tema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Ajustar resolucao da tela
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "::warning title=Resolucao::$($_.Exception.Message)" }
      - name: Medir troca de tema
        timeout-minutes: 5
        run: python scripts/medir_tema.py
