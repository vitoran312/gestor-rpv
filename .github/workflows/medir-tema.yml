name: Medir troca de tema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Ajustar resolucao da tela
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "::warning title=Resolucao::$($_.Exception.Message)" }
      - name: Medir troca de tema
        timeout-minutes: 5
        run: python scripts/medir_tema.py
