name: App do celular

# Publica a pasta celular/ (só o código das telas; nenhum dado) no GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['celular/**', '.github/workflows/celular.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Separar o que vai para o site (sem os testes)
        run: |
          rsync -a --exclude testes celular/ _site/
          # Cada publicação tem a sua versão no service worker: os aparelhos trocam a cópia guardada do app.
          sed -i "s/__VERSAO__/${GITHUB_SHA::12}/" _site/sw.js
          grep -q "${GITHUB_SHA::12}" _site/sw.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site
      - id: publicacao
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
