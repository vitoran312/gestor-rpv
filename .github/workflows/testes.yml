name: Testes

# Roda a suíte completa no Windows a cada push e pull request, e os testes do app do celular no Chromium e
# no WebKit (o motor do Safari). O executável continua sendo gerado só pelo fluxo "Executavel Windows".
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-build.txt pyflakes==3.2.0 pycodestyle==2.12.1
      - name: Conferir o codigo (imports e nomes sem uso, nomes indefinidos)
        run: python -m pyflakes .
      - name: Conferir o estilo (regras em setup.cfg)
        run: python -m pycodestyle .
      - name: Ajustar resolucao da tela
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "::warning title=Resolucao::$($_.Exception.Message)" }
      - name: Testar aplicativo e interface
        timeout-minutes: 15
        env:
          GESTOR_RPV_TESTE_UI: '1'
        run: python scripts/testes_ci.py

  celular:
    name: App do celular (${{ matrix.navegador }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        navegador: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Instalar dependencias do Python
        run: python -m pip install -r requirements-build.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: celular/testes/package-lock.json
      - name: Instalar o Playwright e o navegador
        working-directory: celular/testes
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.navegador }}
      - name: Testar o app do celular
        env:
          GESTOR_RPV_TESTE_CELULAR: '1'
          GESTOR_RPV_NAVEGADOR: ${{ matrix.navegador }}
        run: python -m unittest test_celular -v
