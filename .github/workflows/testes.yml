name: Testes

# Roda a suíte completa no Windows a cada push e pull request; o executável continua sendo gerado só
# pelo fluxo "Executavel Windows", quando pedido.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-build.txt
      - name: Ajustar resolucao da tela
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "::warning title=Resolucao::$($_.Exception.Message)" }
      - name: Testar aplicativo e interface
        timeout-minutes: 15
        env:
          GESTOR_RPV_TESTE_UI: '1'
        run: python scripts/testes_ci.py
