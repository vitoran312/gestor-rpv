name: Executavel Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Instalar ferramenta de compilacao
        run: python -m pip install -r requirements-build.txt
      - name: Ajustar resolucao da tela
        shell: pwsh
        run: |
          # Os testes de layout precisam de janelas largas; o Windows limita cada janela ao tamanho da tela.
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "::warning title=Resolucao::$($_.Exception.Message)" }
          Add-Type -AssemblyName System.Windows.Forms
          $tela = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "::notice title=Tela::$($tela.Width)x$($tela.Height)"
      - name: Testar aplicativo e interface
        timeout-minutes: 15
        env:
          GESTOR_RPV_TESTE_UI: '1'
        run: python scripts/testes_ci.py
      - name: Gerar executavel com icone e versao
        run: python gerar_exe.py
      - name: Abrir executavel sem Python no PATH
        run: python scripts/verificar_exe_windows.py "dist/Gestor de RPV.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GestorRPV-Windows-x64
          path: dist/GestorRPV-Windows-x64-v*.zip
          if-no-files-found: error
          retention-days: 30

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GestorRPV-Windows-x64
          path: pacote
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: pacote/*.zip
          name: Gestor de RPV ${{ github.ref_name }}
          body: |
            Executável portátil para Windows 11 de 64 bits, com ícone Vitoran Tech.
            Baixe GestorRPV-Windows-x64, extraia o ZIP e abra Gestor de RPV.exe.
            Não é necessário instalar Python. Código-fonte e histórico de alterações no repositório.
