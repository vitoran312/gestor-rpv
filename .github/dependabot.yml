# Mantém as actions dos workflows atualizadas: como elas são fixadas por SHA, o Dependabot abre um PR a cada versão nova.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Navegadores dos testes do app do celular (celular/testes/package.json).
  - package-ecosystem: npm
    directory: /celular/testes
    schedule:
      interval: monthly
