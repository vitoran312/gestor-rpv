<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Nada sai do aparelho: a página só carrega arquivos dela mesma e não se conecta a nenhum outro endereço. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data: blob:; worker-src 'self'; object-src 'none'; connect-src 'self'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Gestor de RPV</title>
  <!-- App na Tela de Início do iPhone: nome, ícone e abertura em tela cheia. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icones/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="icones/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icones/icone-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gestor RPV">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- Tela de abertura: o backup guardado neste aparelho (ou um escolhido agora), aberto com Face ID ou senha. -->
  <main id="abertura" class="abertura">
    <h1>Gestor de RPV</h1>
    <div id="fonte" class="cartao" hidden>
      <div id="fonte-titulo" class="discreto pequeno"></div>
      <div id="fonte-detalhe" class="nome"></div>
    </div>
    <button id="abrir-faceid" class="primario" type="button" hidden>Abrir com Face ID</button>
    <form id="formulario" class="cartao formulario" autocomplete="off">
      <label id="rotulo-arquivo" for="arquivo">Backup (.rpvbackup)</label>
      <input id="arquivo" type="file">
      <label for="senha">Senha dos backups</label>
      <input id="senha" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="abrir" class="primario" type="submit">Abrir com a senha</button>
    </form>
    <div id="andamento" class="andamento" hidden>
      <p id="andamento-texto" aria-live="polite"></p>
      <div class="barra"><div id="andamento-barra"></div></div>
    </div>
    <p id="erro" class="erro" role="alert" hidden></p>
    <p class="discreto pequeno">O backup fica guardado neste aparelho como saiu do computador, trancado pela senha;
      nada é enviado para a internet.</p>
    <p id="versao-app" class="discreto pequeno"></p>
    <p id="instalar" class="aviso pequeno" hidden>Para usar como app: no Safari, toque em <strong>Compartilhar</strong>
      e depois em <strong>Adicionar à Tela de Início</strong>.</p>
  </main>

  <!-- Aplicativo: as telas são montadas por app.js conforme o endereço (#inicio, #operacoes...). -->
  <div id="aplicativo" hidden>
    <header class="topo">
      <button id="voltar" class="voltar" type="button" hidden aria-label="Voltar">‹ Voltar</button>
      <h1 id="titulo"></h1>
    </header>
    <main id="tela" class="tela"></main>
    <nav class="abas" aria-label="Telas">
      <a href="#inicio" data-aba="inicio">Início</a>
      <a href="#operacoes" data-aba="operacoes">Operações</a>
      <a href="#contas" data-aba="contas">Contas</a>
      <a href="#mais" data-aba="mais">Mais</a>
    </nav>
  </div>

  <script src="vendor/scrypt.js"></script>
  <script src="vendor/fflate.js"></script>
  <script src="vendor/sql-wasm.js"></script>
  <script src="guarda.js"></script>
  <script src="faceid.js"></script>
  <script src="leitor.js"></script>
  <script src="dados.js"></script>
  <script src="visualizador.js"></script>
  <script src="app.js"></script>
</body>
</html>
